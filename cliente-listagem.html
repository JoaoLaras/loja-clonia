<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres da página. -->
    <meta charset="UTF-8">

    <!-- Adapta a página à largura da tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título exibido na aba do navegador. -->
    <title>Loja Clonia - Listagem de Clientes</title>
</head>
<body>

    <h1>Listagem de Clientes</h1>

    <!-- Apresenta os clientes cadastrados em uma tabela. -->
    <table>

        <!-- Define os títulos das colunas. -->
        <thead>
            <tr>
                <th>Código</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Endereço</th>
                <th>Telefone</th>
                <th>E-mail</th>
            </tr>
        </thead>

        <!-- Recebe as linhas de clientes geradas pelo servidor. -->
        <tbody>
            <!-- LINHAS_CLIENTES -->
        </tbody>

    </table>

    <!-- Permite cadastrar um novo cliente. -->
    <p>
        <a href="/clientes/novo">Cadastrar cliente</a>
    </p>

    <!-- Retorna à página inicial do sistema. -->
    <p>
        <a href="/">Voltar à página inicial</a>
    </p>

</body>
</html>
