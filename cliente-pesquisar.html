<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Clonia - Pesquisar Clientes</title>
</head>
<body>

    <h1>Pesquisar Clientes</h1>

    <!-- Envia os filtros para a listagem de clientes. -->
    <form action="/clientes" method="GET">

        <p>
            <label for="codigo">Código:</label>
            <input id="codigo" name="codigo" type="number" min="1">
        </p>

        <p>
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" type="text">
        </p>

        <p>
            <label for="cpf">CPF:</label>
            <input id="cpf" name="cpf" type="text" maxlength="11">
        </p>

        <p>
            <label for="telefone">Telefone:</label>
            <input id="telefone" name="telefone" type="text" maxlength="11">
        </p>

        <button type="submit">Pesquisar clientes</button>

    </form>

    <p>
        <a href="/">Voltar à página inicial</a>
    </p>

</body>
</html>
