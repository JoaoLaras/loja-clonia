<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja Clonia - Cadastro de Venda</title>
</head>
<body>

    <h1>Cadastro de Venda</h1>

    <!-- Aqui ficará a seleção do cliente. -->
    <p>
        <label for="cliente">Cliente:</label>
        <select id="cliente" name="cliente" required>
            <option value="">Selecione um cliente</option>
            <!-- OPCOES_CLIENTE_CADASTRO -->
        </select>
    </p>

    <!-- Aqui ficará a seleção dos produtos. -->
    <p>
        <label for="produto">Produto:</label>
        <select id="produto" name="produto" required>
            <option value="">Selecione um produto</option>
            <!-- LISTA_PRODUTOS -->
        </select>
    </p>

    <p>
        <label for="estoqueAtual">Estoque atual:</label>
        <input type="number" id="estoqueAtual" value="0" readonly>
    </p>

    <!-- Aqui ficará a lista dos itens adicionados. -->

    <!-- Aqui ficarão os totais à vista e a prazo. -->

    <!-- Aqui ficarão as formas de pagamento. -->

    <p>
        <a href="/">Voltar à página inicial</a>
    </p>

</body>
</html>
