<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja Clonia - Histórico de Estoque</title>
</head>
<body>

    <h1>Histórico de Movimentações de Estoque</h1>

        <form action="/estoque/movimentacoes" method="GET">

        <label for="codigo">Código do produto:</label>

        <input
            type="number"
            id="codigo"
            name="codigo"
            min="1"
            max="2147483647"
            value="<!-- CODIGO_PESQUISADO -->"
            placeholder="Informe o código"
        >

        <label for="tipo">Tipo de movimentação:</label>

      <select id="tipo" name="tipo">
        <option value="" <!-- SELECTED_TODAS -->>Todas</option>
        <option value="E" <!-- SELECTED_ENTRADAS -->>Entradas</option>
        <option value="S" <!-- SELECTED_SAIDAS -->>Saídas</option>
    </select>

        <button type="submit">Pesquisar</button>

    </form> 

    <table border="1">
        <thead>
            <tr>
                <th>Código</th>
                <th>Modelo</th>
                <th>Tipo</th>
                <th>Data</th>
                <th>Quantidade</th>
                <th>Observação</th>
            </tr>
        </thead>

        <tbody>
            <!-- LINHAS_MOVIMENTACOES -->
        </tbody>
    </table>

    <p>
        <a href="/">Voltar ao início</a>
    </p>

</body>
</html>
