<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres da página. -->
    <meta charset="UTF-8">

    <!-- Adapta a página à largura da tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título exibido na aba do navegador. -->
    <title>Loja Clonia - Cadastro de Cliente</title>
</head>
<body>

    <h1>Cadastro de Cliente</h1>

    <!-- Envia os dados do cliente para cadastro utilizando POST. -->
    <form action="/clientes/cadastrar" method="POST">

        <p>
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" type="text" required>
        </p>

        <p>
            <label for="cpf">CPF:</label>
            <input id="cpf" name="cpf" type="text">
        </p>

        <p>
            <label for="endereco">Endereço:</label>
            <input id="endereco" name="endereco" type="text">
        </p>

        <p>
            <label for="telefone">Telefone:</label>
            <input id="telefone" name="telefone" type="tel">
        </p>

        <p>
            <label for="email">E-mail:</label>
            <input id="email" name="email" type="email">
        </p>

        <button type="submit">Cadastrar cliente</button>
    </form>

    <!-- Retorna à listagem de clientes. -->
    <p>
        <a href="/clientes">Listar clientes</a>
    </p>

    <!-- Retorna à página inicial do sistema. -->
    <p>
        <a href="/">Voltar à página inicial</a>
    </p>

</body>
</html>
