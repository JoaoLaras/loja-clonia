
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define a codificação de caracteres da página. -->
    <meta charset="UTF-8">

    <!-- Adapta a página à largura da tela. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título exibido na aba do navegador. -->
    <title>Loja Clonia - Cadastro de Cliente</title>
</head>
<body>

    <h1>Cadastro de Cliente</h1>

    <!-- Envia os dados do cliente para cadastro utilizando POST. -->
    <form action="/clientes/cadastrar" method="POST">

        <p>
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" type="text" required>
        </p>

        <p>
            <label for="cpf">CPF:</label>
            <input
                id="cpf"
                name="cpf"
                type="text"
                maxlength="11"
                inputmode="numeric"
                pattern="[0-9]{11}"
                title="Informe os 11 números do CPF."
                placeholder="00000000000">
        </p>

        <p>
            <label for="endereco">Endereço:</label>
            <input id="endereco" name="endereco" type="text">
        </p>

        <p>
            <label for="telefone">Telefone:</label>
            <input
                id="telefone"
                name="telefone"
                type="text"
                maxlength="13"
                inputmode="numeric"
                placeholder="44-99999-9999">
        </p>

        <p>
            <label for="email">E-mail:</label>
            <input id="email" name="email" type="email">
        </p>

        <button type="submit">Cadastrar cliente</button>
    </form>

    <!-- Retorna à listagem de clientes. -->
    <p>
        <a href="/clientes">Listar clientes</a>
    </p>

    <!-- Retorna à página inicial do sistema. -->
    <p>
        <a href="/">Voltar à página inicial</a>
    </p>

    <script>
        // Localiza o campo de telefone no HTML.
        const campoTelefone = document.getElementById("telefone");

        // Executa a formatação quando o usuário digitar.
        campoTelefone.addEventListener("input", function () {

            // Remove os caracteres que não forem números.
            let telefone = campoTelefone.value.replace(/\D/g, "");

            // Limita o telefone a 11 dígitos.
            telefone = telefone.slice(0, 11);

            // Formata o número conforme a quantidade de dígitos.
            if (telefone.length > 10) {

                // Celular: 44-99999-9999.
                telefone = telefone.slice(0, 2) + "-" +
                           telefone.slice(2, 7) + "-" +
                           telefone.slice(7);

            } else if (telefone.length > 6) {

                // Telefone fixo: 44-3333-4444.
                telefone = telefone.slice(0, 2) + "-" +
                           telefone.slice(2, 6) + "-" +
                           telefone.slice(6);

            } else if (telefone.length > 2) {

                // Acrescenta o hífen após o DDD.
                telefone = telefone.slice(0, 2) + "-" +
                           telefone.slice(2);
            }

            // Atualiza o valor exibido no campo.
            campoTelefone.value = telefone;
        });
    </script>

</body>
</html>
