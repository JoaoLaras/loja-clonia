<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja Clonia - Pesquisar tipos de pagamento</title>
</head>
<body>

    <h1>Pesquisa de tipos de pagamento</h1>

    <form action="/tipos-pagamentos" method="GET">

        <p>
            <label for="descricao">Nome:</label>
            <input type="text" id="descricao" name="descricao">
        </p>

        <p>
            <label for="categoria">Categoria:</label>
            <select id="categoria" name="categoria">
                <option value="">Todas</option>
                <!-- OPCOES_CATEGORIA_CADASTRO -->
            </select>
        </p>

        <p>
            <label for="situacao">Situação:</label>
            <select id="situacao" name="situacao">
                <option value="">Todas</option>
                <option value="ativo">Ativo</option>
                <option value="inativo">Inativo</option>
            </select>
        </p>

        <button type="submit">Pesquisar tipos de pagamento</button>

    </form>

    <p>
        <a href="/tipos-pagamentos">Listar tipos de pagamento</a>
    </p>

    <p><a href="/">Voltar ao início</a></p>

</body>
</html>
