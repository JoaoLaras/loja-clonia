<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar produto - Loja Clonia</title>
</head>
    <body>
        <h1>Editar produto <!-- CODIGO_PRODUTO --></h1>

        <form action="/atualizar" method="POST">
            
            <!-- Envia o código do produto sem exibi-lo na tela. -->
            <input type="hidden" name="codigo"
                value="<!-- CODIGO_PRODUTO -->">

            <p>
                <label for="modelo">Modelo:</label>
                <input id="modelo" name="modelo" type="text"
                    value="<!-- MODELO_PRODUTO -->" required>
            </p>

            <p>
                <label for="cor">Cor:</label>
                <input id="cor" name="cor" type="text"
                    value="<!-- COR_PRODUTO -->" required>
            </p>

            <p>
                <label for="tamanho">Tamanho:</label>

                <select id="tamanho" name="tamanho" required>
                    <!-- OPCOES_TAMANHO -->
                </select>
            </p>

            <button type="submit">Salvar alterações</button>
        </form>
        
        <p><a href="/buscar?codigo=<!-- CODIGO_PRODUTO -->">Cancelar edição</a></p>
        <p><a href="/">Voltar à página inicial</a></p>

    </body>
</html>
